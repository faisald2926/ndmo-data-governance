<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic dataset composition and ground truth</title>
  <desc id="desc">Dataset composition totals 25,106 rows across nine source tables; ground-truth classification covers 11,543 labelled records, of which 6,277 (25.0 percent of the corpus) are Secret or Top secret.</desc>
  <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0c5f4c"/><stop offset="1" stop-color="#25ae83"/></linearGradient></defs>
  <rect width="1200" height="650" rx="26" fill="#f7faf9"/>
  <text x="60" y="70" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#10221e">SYNTHETIC DATASET PROFILE</text>
  <text x="60" y="106" font-family="Arial,sans-serif" font-size="18" fill="#60716b">Realistic Saudi-domain structure without real personal data</text>
  <line x1="600" y1="145" x2="600" y2="600" stroke="#d7e3df" stroke-width="2"/>

  <text x="60" y="160" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0b493b">25,106 rows · nine source tables</text>
  <g font-family="Arial,sans-serif" font-size="15" fill="#263b35" text-anchor="end">
    <text x="195" y="200">Invoices</text>
    <text x="195" y="242">Citizen requests</text>
    <text x="195" y="284">Security incidents</text>
    <text x="195" y="326">Strategic initiatives</text>
    <text x="195" y="368">Employees</text>
    <text x="195" y="410">Internal investigations</text>
    <text x="195" y="452">Vendors</text>
    <text x="195" y="494">Documents register</text>
    <text x="195" y="536">Open data</text>
  </g>
  <g fill="#e4edea">
    <rect x="210" y="180" width="320" height="28" rx="8"/><rect x="210" y="222" width="320" height="28" rx="8"/>
    <rect x="210" y="264" width="320" height="28" rx="8"/><rect x="210" y="306" width="320" height="28" rx="8"/>
    <rect x="210" y="348" width="320" height="28" rx="8"/><rect x="210" y="390" width="320" height="28" rx="8"/>
    <rect x="210" y="432" width="320" height="28" rx="8"/><rect x="210" y="474" width="320" height="28" rx="8"/>
    <rect x="210" y="516" width="320" height="28" rx="8"/>
  </g>
  <g fill="url(#g)">
    <rect x="210" y="180" width="320" height="28" rx="8"/><rect x="210" y="222" width="96" height="28" rx="8"/>
    <rect x="210" y="264" width="73" height="28" rx="8"/><rect x="210" y="306" width="65" height="28" rx="8"/>
    <rect x="210" y="348" width="64" height="28" rx="8"/><rect x="210" y="390" width="64" height="28" rx="8"/>
    <rect x="210" y="432" width="48" height="28" rx="8"/><rect x="210" y="474" width="38" height="28" rx="8"/>
    <rect x="210" y="516" width="32" height="28" rx="8"/>
  </g>
  <g font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#10221e">
    <text x="540" y="200">10,033</text><text x="316" y="242">3,015</text><text x="293" y="284">2,300</text>
    <text x="285" y="326">2,043</text><text x="284" y="368">2,000</text><text x="284" y="410">2,000</text>
    <text x="268" y="452">1,515</text><text x="258" y="494">1,200</text><text x="252" y="536">1,000</text>
  </g>

  <text x="650" y="160" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#0b493b">11,543 labelled records</text>
  <g transform="translate(650 185)" font-family="Arial,sans-serif">
    <rect width="478" height="62" rx="14" fill="#e2f5ee"/><rect width="131" height="62" rx="14" fill="#25a47c"/>
    <text x="150" y="28" font-size="17" font-weight="700" fill="#0c5f4c">Public · عام</text>
    <text x="150" y="49" font-size="15" fill="#4b6b61">3,164 · 27.4%</text>

    <g transform="translate(0 76)"><rect width="478" height="62" rx="14" fill="#e6eef5"/><rect width="87" height="62" rx="14" fill="#2e7fc2"/>
      <text x="150" y="28" font-size="17" font-weight="700" fill="#174f82">Restricted · مقيّد</text>
      <text x="150" y="49" font-size="15" fill="#5a6d7d">2,102 · 18.2%</text></g>

    <g transform="translate(0 152)"><rect width="478" height="62" rx="14" fill="#f6e8de"/><rect width="207" height="62" rx="14" fill="#d75b32"/>
      <text x="226" y="28" font-size="17" font-weight="700" fill="#9f3f23">Secret · سري</text>
      <text x="226" y="49" font-size="15" fill="#785c52">4,996 · 43.3%</text></g>

    <g transform="translate(0 228)"><rect width="478" height="62" rx="14" fill="#f7e3e1"/><rect width="53" height="62" rx="14" fill="#b83c34"/>
      <text x="72" y="28" font-size="17" font-weight="700" fill="#8f302b">Top secret · سري للغاية</text>
      <text x="72" y="49" font-size="15" fill="#785c52">1,281 · 11.1%</text></g>

    <g transform="translate(0 310)"><rect width="478" height="92" rx="18" fill="#0b493b"/>
      <text x="24" y="34" font-size="14" fill="#b8f1dd">CONFIDENTIAL COVERAGE</text>
      <text x="24" y="64" font-size="18" font-weight="700" fill="#fff">6,277 rows · 25.0% of the corpus</text>
      <text x="24" y="82" font-size="13" fill="#8fd8bf">Secret + Top secret, across four registers</text></g>
  </g>
  <text x="1140" y="628" text-anchor="end" font-family="Arial,sans-serif" font-size="15" fill="#71817c">Source: project technical report · June 2026</text>
</svg>
