<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">Mizan - Elm Data Governance Challenge</title>
  <desc id="desc">Project banner for the Elm Technology and Projects data governance challenge team.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d19"/>
      <stop offset="0.55" stop-color="#0b493b"/>
      <stop offset="1" stop-color="#0f745c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#72e0b8" stop-opacity=".34"/>
      <stop offset="1" stop-color="#72e0b8" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#00130e" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1600" height="500" rx="30" fill="url(#bg)"/>
  <circle cx="1360" cy="120" r="330" fill="url(#glow)"/>
  <circle cx="1420" cy="380" r="220" fill="none" stroke="#83e7c2" stroke-opacity=".16" stroke-width="2"/>
  <circle cx="1420" cy="380" r="155" fill="none" stroke="#83e7c2" stroke-opacity=".2" stroke-width="2"/>
  <path d="M1180 80h280M1220 120h290M1250 160h220" stroke="#a9f1d7" stroke-opacity=".15" stroke-width="2"/>

  <g transform="translate(95 76)">
    <rect width="218" height="52" rx="26" fill="#d9f7ec" fill-opacity=".12" stroke="#a9f1d7" stroke-opacity=".35"/>
    <circle cx="28" cy="26" r="7" fill="#7fe4bd"/>
    <text x="50" y="34" fill="#dff9ef" font-family="Arial, sans-serif" font-size="22" font-weight="700">elm | عِلم</text>
  </g>

  <text x="95" y="220" fill="#ffffff" font-family="Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="7">MIZAN</text>
  <text x="99" y="276" fill="#b8f1dd" font-family="Arial, sans-serif" font-size="32" font-weight="600">Explainable data governance, built for Saudi standards.</text>
  <text x="99" y="326" fill="#e5f8f1" font-family="Arial, sans-serif" font-size="28">منصة ميزان لتصنيف وحوكمة البيانات وفق معايير NDMO</text>

  <g transform="translate(95 378)" font-family="Arial, sans-serif" font-size="20" font-weight="600">
    <g filter="url(#shadow)"><rect width="255" height="54" rx="15" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".18"/><text x="24" y="34" fill="#fff">Hybrid classification</text></g>
    <g transform="translate(275)" filter="url(#shadow)"><rect width="220" height="54" rx="15" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".18"/><text x="24" y="34" fill="#fff">6 quality dimensions</text></g>
    <g transform="translate(515)" filter="url(#shadow)"><rect width="200" height="54" rx="15" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".18"/><text x="24" y="34" fill="#fff">End-to-end lineage</text></g>
  </g>

  <g transform="translate(1210 235)" filter="url(#shadow)">
    <rect width="265" height="170" rx="26" fill="#f7fffc" fill-opacity=".95"/>
    <text x="132.5" y="54" text-anchor="middle" fill="#0b493b" font-family="Arial, sans-serif" font-size="21" font-weight="700">DATA GOVERNANCE</text>
    <path d="M62 93h42v42H62zM112 78h42v57h-42zM162 58h42v77h-42z" fill="#15a176"/>
    <path d="M56 140h158" stroke="#0b493b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <text x="1500" y="467" text-anchor="end" fill="#dff9ef" fill-opacity=".75" font-family="Arial, sans-serif" font-size="18">Technology &amp; Projects · Data Governance Challenge Team</text>
